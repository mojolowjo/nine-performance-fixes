[[mods]]
modId="ninefix"
version="1.1.0"
displayName="NINE Performance Fixes"
authors="mojolowjo"
displayURL="https://github.com/mojolowjo/nine-performance-fixes"
# Optional on either side (it adds no network channels): players and servers can each have it or not.
description='''
Performance fixes for the NINE modpack, each with an on/off switch
(Mods -> NINE Performance Fixes -> Config; restart after changes):
 - GeckoLib: skip resource folders it can't read, so its mobs animate again
 - ArPhEx: build its sphere once; search for mob trophies once a second
 - FancyMenu / SpiffyHUD: remember screen lookups
 - SkillExpNotifier: keep its config in memory
 - KubeJS: skip idle highlight buffers; don't start its web server
 - VanillaBackport: no throwaway colour caches
 - Distant Horizons: use at most half the CPU
 - The Obsessed (server): stop resending player data dozens of times per tick
'''

[[mixins]]
config="ninefix.mixins.json"

[[dependencies.ninefix]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ninefix]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.21.2)"
    ordering="NONE"
    side="BOTH"
